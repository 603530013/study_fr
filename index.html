<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>法文課程月曆</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  .day-cell { min-height: 62px; cursor: pointer; transition: all 0.15s; }
  .day-cell:hover { filter: brightness(0.92); }
</style>
</head>
<body class="bg-gray-50 min-h-screen">

<div class="bg-gradient-to-r from-blue-900 via-white to-red-600 p-6 text-center shadow">
  <p class="text-blue-900 font-semibold text-sm">🇫🇷 French Study Planner</p>
  <h1 class="text-2xl font-bold text-blue-900">法文課程月曆</h1>
</div>

<div class="max-w-3xl mx-auto p-4">

  <!-- 月份導覽 -->
  <div class="flex items-center justify-between mb-3 bg-white rounded-2xl shadow px-6 py-3">
    <button onclick="prevMonth()" class="text-blue-600 font-bold text-2xl hover:text-blue-800 w-8">‹</button>
    <h2 class="text-lg font-bold text-gray-800" id="month-title"></h2>
    <button onclick="nextMonth()" class="text-blue-600 font-bold text-2xl hover:text-blue-800 w-8">›</button>
  </div>

  <!-- 圖例 -->
  <div class="flex gap-3 mb-3 flex-wrap text-xs px-1">
    <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-blue-500 inline-block"></span>已上傳課程</span>
    <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-blue-200 inline-block"></span>未來課程</span>
    <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-purple-500 inline-block"></span>已上傳複習</span>
    <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-purple-200 inline-block"></span>未來複習</span>
    <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-green-500 inline-block"></span>今天</span>
  </div>

  <!-- 日曆 -->
  <div class="bg-white rounded-2xl shadow overflow-hidden mb-4">
    <div class="grid grid-cols-7 bg-blue-900 text-white text-center text-sm font-semibold">
      <div class="py-2">日</div><div class="py-2">一</div><div class="py-2">二</div>
      <div class="py-2">三</div><div class="py-2">四</div><div class="py-2">五</div><div class="py-2">六</div>
    </div>
    <div class="grid grid-cols-7 gap-px bg-gray-200" id="calendar-grid"></div>
  </div>

  <!-- 詳情面板 -->
  <div id="detail-panel" class="hidden bg-white rounded-2xl shadow p-6 mb-8">
    <div id="detail-content"></div>
  </div>

</div>

<script>
// ── 舊排程（L1-L7，2026-09-04 起）────────────────────────────
var OLD_START = new Date(2026, 8, 4);
var OLD_THEMES = [
  '', '打招呼與基本禮貌用語', '數字 0-20', '顏色', '家庭成員',
  '食物與飲料', '星期與月份', '身體部位', '衣物', '情緒與感受',
  '動詞 être（是）', '動詞 avoir（有）', '動詞 aller（去）',
  '動詞 faire（做）', '動詞 vouloir/pouvoir', '地點與方向',
  '天氣與季節', '時間表達', '購物用語', '餐廳點餐用語', '複習與綜合練習'
];

// ── 新排程（2026-10-05 起，從衣物開始，每週一主題）──────────
var NEW_START = new Date(2026, 9, 5);
var OLD_END = new Date(2026, 8, 11);  // 舊排程結束（exclusive）
var THEME_OFFSET = 8;                 // 第1週主題 = THEMES[9] = 衣物

var DAY_FOCUS = ['詞彙入門','語法深入','情境對話','進階表達','本週整理'];

function toDateOnly(d) {
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}
function padZ(n) { return String(n).padStart(2, '0'); }

function getLessonInfo(date) {
  var d = toDateOnly(date);
  var oldS = toDateOnly(OLD_START);
  var oldE = toDateOnly(OLD_END);
  var newS = toDateOnly(NEW_START);

  if (d < oldS) return null;

  var y = d.getFullYear();
  var mo = padZ(d.getMonth() + 1);
  var dd = padZ(d.getDate());
  var dateStr = '' + y + mo + dd;

  // 舊排程：L1-L7（2026-09-04 到 2026-09-10）
  if (d < oldE) {
    var N_old = Math.round((d - oldS) / 86400000);
    if (N_old % 11 === 10) {
      var r = Math.floor(N_old / 11) + 1;
      return { type: 'review', label: 'R' + r, theme: '第' + (((r-1)*10+1)) + '～' + (r*10) + '課複習',
               file: 'fr_review_' + r + '_' + dateStr + '.html', dateStr: dateStr, legacy: true };
    } else {
      var ln = Math.floor(N_old / 11) * 10 + (N_old % 11) + 1;
      var ti = ((ln - 1) % 20) + 1;
      return { type: 'lesson', label: 'L' + ln, theme: OLD_THEMES[ti],
               file: 'fr_lesson_' + ln + '_' + dateStr + '.html', dateStr: dateStr, legacy: true };
    }
  }

  // 空白期（2026-09-11 到 2026-10-04）
  if (d < newS) return null;

  // 新排程：每週一主題（衣物起）
  var N = Math.round((d - newS) / 86400000);
  var weekNum = Math.floor(N / 7) + 1;
  var dayInWeek = N % 7;
  var themeIdx = ((Math.floor(N / 7) + THEME_OFFSET) % 20) + 1;
  var theme = OLD_THEMES[themeIdx];

  if (dayInWeek <= 4) {
    var dayNum = dayInWeek + 1;
    var focus = DAY_FOCUS[dayInWeek];
    return {
      type: 'lesson',
      label: 'W' + weekNum + 'D' + dayNum,
      theme: theme + '・' + focus,
      week: weekNum, day: dayNum,
      file: 'fr_w' + weekNum + 'd' + dayNum + '_' + dateStr + '.html',
      dateStr: dateStr
    };
  } else {
    var rDay = dayInWeek - 4;
    var rLabel = rDay === 1 ? '週末複習' : '週末挑戰';
    return {
      type: 'review',
      label: 'W' + weekNum + 'R' + rDay,
      theme: theme + '・' + rLabel,
      week: weekNum, reviewDay: rDay,
      file: 'fr_w' + weekNum + 'r' + rDay + '_' + dateStr + '.html',
      dateStr: dateStr
    };
  }
}

var curYear, curMonth, selectedDate;

function init() {
  var now = new Date();
  curYear = now.getFullYear();
  curMonth = now.getMonth();
  render();
}

function render() {
  var today = toDateOnly(new Date());
  var firstDay = new Date(curYear, curMonth, 1);
  var lastDay = new Date(curYear, curMonth + 1, 0);
  var monthNames = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
  document.getElementById('month-title').textContent = curYear + ' 年 ' + monthNames[curMonth];

  var html = '';
  for (var i = 0; i < firstDay.getDay(); i++) {
    html += '<div class="bg-gray-50 min-h-16 p-1"></div>';
  }

  for (var day = 1; day <= lastDay.getDate(); day++) {
    var d = new Date(curYear, curMonth, day);
    var info = getLessonInfo(d);
    var isToday = toDateOnly(d).getTime() === today.getTime();
    var isPast = toDateOnly(d) <= today;
    var isSel = selectedDate && toDateOnly(d).getTime() === toDateOnly(selectedDate).getTime();

    var bg;
    if (isToday) {
      bg = 'bg-green-500 text-white';
    } else if (!info) {
      bg = 'bg-gray-50 text-gray-300';
    } else if (info.type === 'review') {
      bg = isPast ? 'bg-purple-500 text-white' : 'bg-purple-100 text-purple-700';
    } else {
      bg = isPast ? 'bg-blue-500 text-white' : 'bg-blue-100 text-blue-600';
    }

    var ring = isSel ? ' ring-2 ring-gray-800 ring-inset z-10 relative' : '';
    var badge = info ? '<span class="text-xs font-bold leading-tight">' + info.label + '</span>' : '';

    html += '<div class="day-cell ' + bg + ring + ' p-1 flex flex-col items-center pt-2 select-none"' +
      (info ? ' onclick="selectDay(' + curYear + ',' + curMonth + ',' + day + ')"' : '') + '>' +
      '<span class="text-sm font-semibold">' + day + '</span>' +
      badge + '</div>';
  }

  document.getElementById('calendar-grid').innerHTML = html;
  if (selectedDate) renderDetail(selectedDate);
}

function selectDay(y, m, d) {
  selectedDate = new Date(y, m, d);
  render();
  document.getElementById('detail-panel').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function renderDetail(date) {
  var panel = document.getElementById('detail-panel');
  var content = document.getElementById('detail-content');
  var info = getLessonInfo(date);
  var today = toDateOnly(new Date());
  var isPast = toDateOnly(date) <= today;
  var dateLabel = date.getFullYear() + '/' + padZ(date.getMonth() + 1) + '/' + padZ(date.getDate());

  if (!info) {
    content.innerHTML = '<p class="text-gray-500">📅 ' + dateLabel + '：尚無課程安排</p>';
    panel.classList.remove('hidden');
    return;
  }

  var isLesson = info.type === 'lesson';
  var badgeColor = isPast
    ? (isLesson ? 'bg-blue-500' : 'bg-purple-500')
    : (isLesson ? 'bg-blue-300' : 'bg-purple-300');

  var linkHtml;
  if (isPast) {
    var btnColor = isLesson ? 'bg-blue-500 hover:bg-blue-600' : 'bg-purple-500 hover:bg-purple-600';
    var btnText = isLesson ? '📖 開始學習 →' : '🏆 進入複習 →';
    linkHtml = '<a href="' + info.file + '" class="inline-block ' + btnColor + ' text-white font-semibold px-5 py-2 rounded-xl transition">' + btnText + '</a>';
  } else {
    linkHtml = '<p class="text-gray-400 text-sm">⏰ 課程將於此日生成並上傳</p>' +
               '<p class="text-gray-400 text-xs mt-1">檔名：' + info.file + '</p>';
  }

  // 新排程：顯示週進度
  var weekProgress = '';
  if (!info.legacy && info.week) {
    var dots = '';
    for (var i = 1; i <= 5; i++) {
      var active = info.type === 'lesson' && info.day === i;
      dots += '<span class="px-2 py-1 rounded text-xs font-bold ' +
        (active ? 'bg-blue-500 text-white' : 'bg-gray-100 text-gray-400') + '">D' + i + '</span>';
    }
    var r1Active = info.type === 'review' && info.reviewDay === 1;
    var r2Active = info.type === 'review' && info.reviewDay === 2;
    dots += '<span class="px-2 py-1 rounded text-xs font-bold ' + (r1Active ? 'bg-purple-500 text-white' : 'bg-gray-100 text-gray-400') + '">R1</span>';
    dots += '<span class="px-2 py-1 rounded text-xs font-bold ' + (r2Active ? 'bg-purple-500 text-white' : 'bg-gray-100 text-gray-400') + '">R2</span>';
    weekProgress = '<div class="flex gap-1 mb-3">' + dots + '</div>';
  }

  content.innerHTML =
    '<div class="flex items-center gap-3 mb-3">' +
    '<span class="px-3 py-1 rounded-full text-white font-bold text-sm ' + badgeColor + '">' + info.label + '</span>' +
    '<div><p class="text-xs text-gray-400">' + dateLabel + '</p>' +
    '<p class="font-bold text-gray-800 text-xl">' + info.theme + '</p></div>' +
    '</div>' +
    weekProgress +
    linkHtml;

  panel.classList.remove('hidden');
}

function prevMonth() {
  curMonth--;
  if (curMonth < 0) { curMonth = 11; curYear--; }
  render();
}
function nextMonth() {
  curMonth++;
  if (curMonth > 11) { curMonth = 0; curYear++; }
  render();
}

init();
</script>
</body>
</html>
